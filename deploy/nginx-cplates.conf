# /etc/nginx/sites-available/cplates — CPlates, a static site (no container).
# Files: /srv/cplates/current -> releases/<commit> (deploy/deploy.sh).
# Stage 1 (this file): HTTP only, with the ACME webroot, until DNS points here.
# Stage 2: deploy/nginx-cplates-tls.conf after `certbot certonly --webroot`.
server {
    listen 80;
    listen [::]:80;
    server_name cplates.nopeoplestime.info;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/cplates/acme;
    }

    root /srv/cplates/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }
}
