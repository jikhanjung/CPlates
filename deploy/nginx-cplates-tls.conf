# /etc/nginx/sites-available/cplates — stage 2, after the certificate exists:
#   sudo certbot certonly --webroot -w /srv/cplates/acme -d cplates.nopeoplestime.info
# Same layout as earththrutime3d: port 80 only answers ACME and redirects.
server {
    listen 80;
    listen [::]:80;
    server_name cplates.nopeoplestime.info;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/cplates/acme;
    }
    location / {
        return 301 https://cplates.nopeoplestime.info$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cplates.nopeoplestime.info;
    ssl_certificate /etc/letsencrypt/live/cplates.nopeoplestime.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cplates.nopeoplestime.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/cplates/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }
}
